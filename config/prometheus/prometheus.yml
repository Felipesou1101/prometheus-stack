global:
  scrape_interval: 1m
  evaluation_interval: 1m

  scrape_configs:
    - job_name: 'prometheus'
      static_configs:
        - targets: ['192.168.1.100:9090']

    - job_name: 'cadvisor'
      static_configs:
        - targets: ['192.168.1.100:8080']

    - job_name: 'node-exporter'
      static_configs:
        - targets: ['192.168.1.100:9100']

    - job_name: 'blackbox-exporter'
      metrics_path: /probe
      params:
        module: [http_2xx]
      static_configs:
        - targets:
          - https://cbs.felipesilva.tec.br
          - https://portainer.felipesilva.tec.br
          - https://grafana.felipesilva.tec.br
          - https://prometheus.felipesilva.tec.br
          - https://alertmanager.felipesilva.tec.br
          - https://cadvisor.felipesilva.tec.br
          - https://ssh.felipesilva.tec.br
          - https://authentik.felipesilva.tec.br

      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: blackbox-exporter:9115